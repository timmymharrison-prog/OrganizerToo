<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Daily Organizer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind (styling) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (lets the app run in any browser) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase (cloud login + saving) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import { getFirestore, initializeFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC21uDcMLyGso3kLqBYimTL8loUi5zzLjw",
      authDomain: "nova-quick.firebaseapp.com",
      projectId: "nova-quick",
      storageBucket: "nova-quick.firebasestorage.app",
      messagingSenderId: "914595554926",
      appId: "1:914595554926:web:78a208943b4696529aa87f",
      measurementId: "G-B2W158FBM2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { ignoreUndefinedProperties: true });
    const storage = getStorage(app);

    window.fb = {
      onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
      signUp: (email, pw) => createUserWithEmailAndPassword(auth, email, pw),
      signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
      signOut: () => signOut(auth),
      loadData: async (uid) => { const snap = await getDoc(doc(db, "users", uid)); return snap.exists() ? snap.data() : null; },
      saveData: (uid, data) => setDoc(doc(db, "users", uid), data),
      subscribe: (uid, cb) => onSnapshot(doc(db, "users", uid), (snap) => cb(snap.exists() ? snap.data() : null)),
      uploadFile: async (uid, itemId, file) => {
        const path = `users/${uid}/att/${itemId}/${Date.now()}_${file.name}`;
        const r = storageRef(storage, path);
        await uploadBytes(r, file);
        const url = await getDownloadURL(r);
        return { name: file.name, url, path };
      },
      deleteFile: (path) => deleteObject(storageRef(storage, path)),
    };
    window.dispatchEvent(new Event("fb-ready"));
  </script>

  <style>
    body { margin: 0; background: #efe2d0; }
    .rich-note:empty:before { content: 'Write something…'; color: #b89a93; }
    .rich-note h1 { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 700; color: #3a2420; margin: .35em 0; }
    .rich-note h2 { font-family: 'Fraunces', serif; font-size: 1.08rem; font-weight: 600; color: #3a2420; margin: .35em 0; }
    .rich-note ul { list-style: disc; padding-left: 1.4rem; margin: .25em 0; }
    .rich-note ol { list-style: decimal; padding-left: 1.4rem; margin: .25em 0; }
    .rich-note a { color: #7c2d24; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ---- saving helpers (work on a real website) ----
    function load(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    }
    function save(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    // ---- helpers ----
    const pad = (n) => String(n).padStart(2, "0");
    const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DOW = ["S", "M", "T", "W", "T", "F", "S"];

    const TABS = [
      { id: "day", label: "Day", color: "#e8a7a0" },
      { id: "week", label: "Week", color: "#f3d98b" },
      { id: "month", label: "Month", color: "#ffffff" },
      { id: "year", label: "Year", color: "#a9c8e8" },
      { id: "tasks", label: "Tasks", color: "#c9b6e4" },
      { id: "folders", label: "Folders", color: "#a9d6c4" },
      { id: "notes", label: "Notes", color: "#f2c6a0" },
    ];
    const FOLDER_COLORS = ["#e8a7a0", "#f3d98b", "#a9c8e8", "#c9b6e4", "#f2c6a0", "#a9d6c4", "#d3b8a3", "#b6c98a"];
    const stableStringify = (v) => {
      if (Array.isArray(v)) return "[" + v.map(stableStringify).join(",") + "]";
      if (v && typeof v === "object") return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + stableStringify(v[k])).join(",") + "}";
      return JSON.stringify(v);
    };

    const SEED_EVENTS = {
      "2026-06-06": [{ id: 1, title: "Tina's birthday", emoji: "🎁" }],
      "2026-06-13": [{ id: 2, title: "TJ P birthday", emoji: "🎁" }],
      "2026-07-01": [{ id: 3, title: "Ray's birthday", emoji: "🎁" }],
    };
    const SEED_TASKS = [
      { id: 11, title: "Buy Tina a gift", done: false, date: "2026-06-05" },
      { id: 12, title: "Call the dentist", done: false, date: "2026-06-04" },
      { id: 13, title: "Water the plants", done: true, date: "2026-06-04" },
    ];
    const SEED_NOTES = [
      { id: 21, html: "Grocery list: eggs, coffee, flowers for Tina." },
    ];
    const escapeHtml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const HEADING_OPTS = [
      { label: "Normal text", value: "<p>" },
      { label: "Heading 1", value: "<h1>" },
      { label: "Heading 2", value: "<h2>" },
    ];
    const LIST_OPTS = [
      { label: "• Bullet list", value: "insertUnorderedList" },
      { label: "1. Numbered list", value: "insertOrderedList" },
    ];

    function Organizer() {
      const today = new Date();
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [cloudLoaded, setCloudLoaded] = useState(false);
      const [saveState, setSaveState] = useState("");
      const lastJsonRef = useRef("");
      const [view, setView] = useState("month");
      const [cursor, setCursor] = useState({ y: today.getFullYear(), m: today.getMonth() });
      const [selected, setSelected] = useState(keyOf(today.getFullYear(), today.getMonth(), today.getDate()));

      // load saved data if present, otherwise use the samples
      const [events, setEvents] = useState(() => {
        const v = load("organizer_events", SEED_EVENTS);
        return (v && typeof v === "object" && !Array.isArray(v)) ? v : SEED_EVENTS;
      });
      const [tasks, setTasks] = useState(() => {
        const v = load("organizer_tasks", SEED_TASKS);
        return Array.isArray(v) ? v : SEED_TASKS;
      });

      // save automatically whenever something changes
      useEffect(() => { save("organizer_events", events); }, [events]);
      useEffect(() => { save("organizer_tasks", tasks); }, [tasks]);

      const [newItem, setNewItem] = useState("");
      const [addType, setAddType] = useState("task");
      const [newTime, setNewTime] = useState("");
      const [newDate, setNewDate] = useState("");
      const [newEndDate, setNewEndDate] = useState("");
      const [newEndTime, setNewEndTime] = useState("");
      const [notes, setNotes] = useState(() => {
        const loaded = load("organizer_notes", SEED_NOTES);
        return (Array.isArray(loaded) ? loaded : SEED_NOTES).map((n) => (n.html != null ? n : { id: n.id, html: escapeHtml(n.text || "") }));
      });
      useEffect(() => { save("organizer_notes", notes); }, [notes]);
      const [folders, setFolders] = useState(() => {
        const v = load("organizer_folders", []);
        return Array.isArray(v) ? v : [];
      });
      useEffect(() => { save("organizer_folders", folders); }, [folders]);
      const [newFolder, setNewFolder] = useState("");
      const [openFolder, setOpenFolder] = useState(null);

      // watch login state
      useEffect(() => {
        const subscribe = () => window.fb.onAuthStateChanged((u) => {
          setUser(u);
          setAuthReady(true);
          if (!u) setCloudLoaded(false);
        });
        let unsub;
        if (window.fb) { unsub = subscribe(); }
        else {
          const h = () => { unsub = subscribe(); };
          window.addEventListener("fb-ready", h, { once: true });
          return () => window.removeEventListener("fb-ready", h);
        }
        return () => { if (unsub) unsub(); };
      }, []);

      // live connection: apply this user's data in real time, on any browser
      useEffect(() => {
        if (!user || !window.fb) return;
        const unsub = window.fb.subscribe(user.uid, (data) => {
          if (data) {
            const incoming = {
              events: (data.events && typeof data.events === "object" && !Array.isArray(data.events)) ? data.events : {},
              tasks: Array.isArray(data.tasks) ? data.tasks : [],
              notes: Array.isArray(data.notes) ? data.notes : [],
              folders: Array.isArray(data.folders) ? data.folders : [],
            };
            const json = stableStringify(incoming);
            if (json !== lastJsonRef.current) {
              lastJsonRef.current = json;
              setEvents(incoming.events);
              setTasks(incoming.tasks);
              setNotes(incoming.notes);
              setFolders(incoming.folders);
            }
            setCloudLoaded(true);
          } else {
            // brand-new account: seed the cloud with whatever is here now
            const payload = { events, tasks, notes, folders };
            lastJsonRef.current = stableStringify(payload);
            window.fb.saveData(user.uid, payload).catch((e) => console.error(e));
            setCloudLoaded(true);
          }
        });
        return () => unsub && unsub();
      }, [user]);

      // save to the cloud whenever YOUR data changes (skips echoes from the live feed)
      useEffect(() => {
        if (!cloudLoaded || !user || !window.fb) return;
        const payload = { events, tasks, notes, folders };
        const json = stableStringify(payload);
        if (json === lastJsonRef.current) return;
        setSaveState("saving");
        const t = setTimeout(() => {
          lastJsonRef.current = json;
          window.fb.saveData(user.uid, payload)
            .then(() => setSaveState("saved"))
            .catch((e) => { console.error(e); setSaveState("error:" + ((e && (e.message || e.code)) || "unknown")); });
        }, 800);
        return () => clearTimeout(t);
      }, [events, tasks, notes, folders, cloudLoaded, user]);
      const [noteSel, setNoteSel] = useState({ id: null, text: "" });
      const [flash, setFlash] = useState("");
      const [expandedTask, setExpandedTask] = useState(null);
      const [expandedEvent, setExpandedEvent] = useState(null);
      const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.matchMedia("(max-width: 640px)").matches);
      const [menuOpen, setMenuOpen] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia("(max-width: 640px)");
        const handler = (e) => setIsMobile(e.matches);
        if (mq.addEventListener) mq.addEventListener("change", handler); else mq.addListener(handler);
        return () => { if (mq.removeEventListener) mq.removeEventListener("change", handler); else mq.removeListener(handler); };
      }, []);

      const firstDow = new Date(cursor.y, cursor.m, 1).getDay();
      const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      const move = (dir) => {
        let m = cursor.m + dir, y = cursor.y;
        if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
        setCursor({ y, m });
      };

      const addDaysKey = (k, n) => {
        const [y, m, d] = k.split("-").map(Number);
        const dt = new Date(y, m - 1, d + n);
        return keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
      };
      const shiftWeek = (dir) => setSelected((s) => addDaysKey(s, dir * 7));
      const shiftDay = (dir) => setSelected((s) => addDaysKey(s, dir));
      const weekKeys = (() => {
        const [y, m, d] = selected.split("-").map(Number);
        const dt = new Date(y, m - 1, d);
        const sun = new Date(dt);
        sun.setDate(dt.getDate() - dt.getDay());
        return Array.from({ length: 7 }, (_, i) => {
          const x = new Date(sun);
          x.setDate(sun.getDate() + i);
          return keyOf(x.getFullYear(), x.getMonth(), x.getDate());
        });
      })();
      const weekLabel = (() => {
        const [ay, am, ad] = weekKeys[0].split("-").map(Number);
        const [by, bm, bd] = weekKeys[6].split("-").map(Number);
        const da = new Date(ay, am - 1, ad);
        const db = new Date(by, bm - 1, bd);
        if (am === bm) return `${da.toLocaleDateString(undefined, { month: "short" })} ${ad}–${bd}, ${by}`;
        return `${da.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${db.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
      })();

      const tasksFor = (k) => (Array.isArray(tasks) ? tasks : []).filter((t) => t.date === k);
      const eventsFor = (k) => (events && events[k]) || [];
      const todayKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());

      const addItem = () => {
        const text = newItem.trim();
        if (!text) return;
        if (addType === "task") {
          const date = newDate || selected;
          setTasks((p) => [...p, { id: Date.now(), title: text, done: false, date, time: newTime || "", folder: newFolder || "" }]);
        } else {
          const startDate = newDate || selected;
          const startTime = newTime || "";
          const endDate = newEndDate || startDate;
          const endTime = newEndTime || "";
          setEvents((p) => ({ ...p, [startDate]: [...(p[startDate] || []), { id: Date.now(), title: text, emoji: "", startDate, startTime, endDate, endTime, folder: newFolder || "" }] }));
        }
        setNewItem(""); setNewTime(""); setNewDate(""); setNewEndDate(""); setNewEndTime(""); setNewFolder("");
      };

      const addFolder = (name) => {
        const id = "f" + Date.now();
        setFolders((p) => [...p, { id, name }]);
        return id;
      };
      const delFolder = (id) => {
        setFolders((p) => p.filter((f) => f.id !== id));
        setTasks((p) => p.map((t) => (t.folder === id ? { ...t, folder: "" } : t)));
        setEvents((p) => {
          const next = {};
          for (const k of Object.keys(p)) next[k] = (p[k] || []).map((e) => (e.folder === id ? { ...e, folder: "" } : e));
          return next;
        });
        if (openFolder === id) setOpenFolder(null);
      };
      const folderName = (id) => { const f = folders.find((x) => x.id === id); return f ? f.name : ""; };
      const folderColor = (id) => { const i = folders.findIndex((x) => x.id === id); return FOLDER_COLORS[(i < 0 ? 0 : i) % FOLDER_COLORS.length]; };

      const toggleTask = (id) =>
        setTasks((p) => p.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
      const updateTask = (id, patch) =>
        setTasks((p) => p.map((t) => (t.id === id ? { ...t, ...patch } : t)));
      const delTask = (id) => setTasks((p) => p.filter((t) => t.id !== id));
      const delEvent = (k, id) =>
        setEvents((p) => ({ ...p, [k]: (p[k] || []).filter((e) => e.id !== id) }));
      const updateEvent = (k, id, patch) =>
        setEvents((p) => ({ ...p, [k]: (p[k] || []).map((e) => (e.id === id ? { ...e, ...patch } : e)) }));
      const editEvent = (oldKey, id, patch) =>
        setEvents((p) => {
          const arr = p[oldKey] || [];
          const ev = arr.find((e) => e.id === id);
          if (!ev) return p;
          const updated = { ...ev, ...patch };
          const newKey = updated.startDate || oldKey;
          if (newKey === oldKey) return { ...p, [oldKey]: arr.map((e) => (e.id === id ? updated : e)) };
          const next = { ...p, [oldKey]: arr.filter((e) => e.id !== id) };
          next[newKey] = [...(next[newKey] || []), updated];
          return next;
        });

      const addNote = () => setNotes((p) => [{ id: Date.now(), html: "" }, ...p]);
      const updateNote = (id, html) => setNotes((p) => p.map((n) => (n.id === id ? { ...n, html } : n)));
      const delNote = (id) => setNotes((p) => p.filter((n) => n.id !== id));

      const savedRange = useRef(null);
      const captureRange = () => {
        const s = window.getSelection();
        if (s && s.rangeCount) savedRange.current = s.getRangeAt(0).cloneRange();
      };
      const exec = (cmd, val) => {
        const s = window.getSelection();
        if (savedRange.current) { s.removeAllRanges(); s.addRange(savedRange.current); }
        document.execCommand(cmd, false, val);
        if (s.rangeCount) savedRange.current = s.getRangeAt(0).cloneRange();
      };

      const onEditorSelect = (noteId) => {
        captureRange();
        const s = window.getSelection();
        const t = s ? s.toString() : "";
        if (t && t.trim()) setNoteSel({ id: noteId, text: t });
      };
      const taskFromSelection = (noteId) => {
        const text = noteSel.text.trim();
        if (!text) return;
        setTasks((p) => [...p, { id: Date.now(), title: text, done: false, date: todayKey, note: noteId }]);
        setNoteSel({ id: null, text: "" });
        setFlash("Added to today’s tasks ✓");
        setTimeout(() => setFlash(""), 1600);
      };

      const prettyDay = (k) => {
        const [y, m, d] = k.split("-").map(Number);
        const dt = new Date(y, m - 1, d);
        return dt.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      };

      const fmtTime = (t) => {
        if (!t) return "";
        const [h, m] = t.split(":").map(Number);
        const ampm = h >= 12 ? "PM" : "AM";
        const hh = ((h + 11) % 12) + 1;
        return `${hh}:${String(m).padStart(2, "0")} ${ampm}`;
      };
      const byTime = (a, b) => (a.time || "99:99").localeCompare(b.time || "99:99");

      const shortDate = (k) => { if (!k) return ""; const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
      const eventTimeLabel = (e) => {
        const sameDay = !e.endDate || e.endDate === e.startDate;
        if (sameDay) {
          if (e.startTime && e.endTime) return `${fmtTime(e.startTime)} – ${fmtTime(e.endTime)}`;
          if (e.startTime) return fmtTime(e.startTime);
          return "";
        }
        const a = `${shortDate(e.startDate)}${e.startTime ? " " + fmtTime(e.startTime) : ""}`;
        const b = `${shortDate(e.endDate)}${e.endTime ? " " + fmtTime(e.endTime) : ""}`;
        return `${a} → ${b}`;
      };

      const selDayCount = tasksFor(selected).length + eventsFor(selected).length;

      if (!authReady) return <Splash message="Starting up…" />;
      if (!user) return <LoginScreen />;
      if (!cloudLoaded) return <Splash message="Loading your planner…" />;

      return (
        <div style={{ fontFamily: "'Newsreader', Georgia, serif" }}
          className={"min-h-screen w-full flex justify-center " + (isMobile ? "items-start" : "items-center p-4")}>
          <div className="fixed top-3 right-3 z-50 flex items-center gap-2">
            {saveState === "saving" && <span className="text-[11px]" style={{ color: "#9c8a82" }}>Saving…</span>}
            {saveState === "saved" && <span className="text-[11px]" style={{ color: "#5a7d3a" }}>Saved ✓</span>}
            {saveState.startsWith("error") && <span className="text-[11px] cursor-help" title={saveState.slice(6)} style={{ color: "#b3261e" }}>Save failed ⚠</span>}
            <button onClick={() => window.fb.signOut()}
              className="text-xs rounded-md px-3 py-1.5" style={{ background: "#7c2d24", color: "#fff" }}>Sign out</button>
          </div>

          <div className={isMobile ? "w-full" : "w-full max-w-2xl rounded-[28px] p-3 shadow-2xl"}
            style={isMobile ? { background: "#fbf7f0", border: "1px solid #7c2d24", minHeight: "100vh" } : { background: "linear-gradient(145deg,#7c2d24,#5e201a)" }}>
            <div className="flex">
              <div className={"flex-1 overflow-hidden " + (isMobile ? "" : "rounded-l-2xl rounded-r-md")}
                style={{ background: "#fbf7f0", boxShadow: isMobile ? "none" : "inset 0 0 30px rgba(120,45,36,0.06)" }}>
                <div className={isMobile ? "p-2 min-h-[760px]" : "p-7 min-h-[760px]"}>

                  {/* mobile view menu */}
                  {isMobile && (
                    <div className="mb-4 relative">
                      <button onClick={() => setMenuOpen((o) => !o)}
                        className="flex items-center gap-2 text-sm rounded-md px-3 py-2 font-semibold"
                        style={{ background: "#7c2d24", color: "#fff" }}>
                        <span style={{ fontSize: "15px" }}>☰</span> {(TABS.find((t) => t.id === view) || {}).label || "Menu"}
                      </button>
                      {menuOpen && (
                        <div className="absolute z-40 mt-1 rounded-lg shadow-xl overflow-hidden" style={{ background: "#fff", border: "1px solid #e5d8c5", minWidth: "160px" }}>
                          {TABS.map((t) => (
                            <button key={t.id} onClick={() => { setView(t.id); setMenuOpen(false); }}
                              className="flex items-center gap-2 w-full text-left px-4 py-2.5 text-sm"
                              style={{ background: view === t.id ? "#f4e7da" : "#fff", color: "#3a2420", fontWeight: view === t.id ? 600 : 400 }}>
                              <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ background: t.color === "#ffffff" ? "#d8cbb8" : t.color }} />
                              {t.label}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* ===== MONTH VIEW ===== */}
                  {view === "month" && (
                    <>
                      <div className="flex items-center justify-between mb-4">
                        <button onClick={() => move(-1)} className="px-2 text-2xl leading-none" style={{ color: "#7c2d24" }}>‹</button>
                        <h1 style={{ fontFamily: "'Fraunces', serif", color: "#3a2420", fontWeight: 700 }} className="text-2xl tracking-tight">
                          {MONTHS[cursor.m]} {cursor.y}
                        </h1>

                  {/* ===== YEAR VIEW ===== */}

                    <>

                        <h1 style={{ fontFamily: "'Fraunces', serif", color: "#3a2420", fontWeight: 700 }} className="text-2xl tracking-tight">{cursor.y}</h1>
                        <button onClick={() => setCursor((c) => ({ ...c, y: c.y + 1 }))} className="px-2 text-2xl leading-none" style={{ color: "#7c2d24" }}>›</button>
                      </div>

                      <div className="grid grid-cols-3 gap-2.5">
                        {Array.from({ length: 12 }).map((_, m) => {
                          const fdow = new Date(cursor.y, m, 1).getDay();
                          const dim = new Date(cursor.y, m + 1, 0).getDate();
                          const cellsM = [...Array(fdow).fill(null), ...Array.from({ length: dim }, (_, i) => i + 1)];
                          return (
                            <button key={m} onClick={() => { setCursor({ y: cursor.y, m }); setView("month"); }}
                              className="rounded-lg p-1.5 text-left transition"
                              style={{ background: "#fffdf8", border: "1px solid #eee2d2" }}>
                              <div style={{ fontFamily: "'Fraunces', serif", color: "#7c2d24", fontWeight: 600 }} className="text-[11px] mb-1 text-center">
                                {MONTHS[m]}
                              </div>
                              <div className="grid grid-cols-7 gap-y-0.5">
                                {DOW.map((d, i) => (
                                  <div key={"h" + i} className="text-center text-[7px] font-semibold" style={{ color: "#cdbcb2" }}>{d}</div>
                                ))}
                                {cellsM.map((d, i) => {
                                  if (!d) return <div key={i} className="h-[14px]" />;
                                  const k = keyOf(cursor.y, m, d);
                                  const has = eventsFor(k).length > 0 || tasksFor(k).length > 0;
                                  const isToday = k === todayKey;
                                  return (
                                    <div key={i} className="flex justify-center">
                                      <span className="inline-flex items-center justify-center w-[14px] h-[14px] text-[9px] rounded-full"
                                        style={isToday
                                          ? { background: "#7c2d24", color: "#fff", fontWeight: 700 }
                                          : has
                                            ? { background: "#f0e2cf", color: "#3a2420", fontWeight: 600 }
                                            : { color: "#6b5a52" }}>
                                        {d}
                                      </span>
                                    </div>
                                  );
                                })}
                              </div>
                            </button>
                          );
                        })}
                      </div>

                      <div className="flex items-center justify-center gap-4 mt-4 text-[11px]" style={{ color: "#b89a93" }}>
                        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full" style={{ background: "#7c2d24" }} />Today</span>
                        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full" style={{ background: "#f0e2cf" }} />Has plans</span>
                      </div>
                    </>
                  )}

                  {/* ===== FOLDERS VIEW ===== */}
                  {view === "folders" && (() => {

                      const fEvents = allEvents.filter((e) => e.folder === openFolder).sort((a, b) => (a.startDate || "").localeCompare(b.startDate || "") || byTime({ time: a.startTime }, { time: b.startTime }));

                        <>
                          <button onClick={() => setOpenFolder(null)} className="text-sm mb-3" style={{ color: "#7c2d24" }}>‹ All folders</button>

                            <span className="inline-block w-3 h-3 rounded-full" style={{ background: folderColor(openFolder) }} />{folderName(openFolder)}

                          <h2 style={{ fontFamily: "'Fraunces', serif", color: "#3a2420" }} className="text-sm font-semibold mb-1.5 flex items-center gap-2"><span style={{ color: "#c9a227" }}>●</span> Tasks</h2>
                          {fTasks.length === 0 && <p className="text-xs italic mb-3" style={{ color: "#c9b8af" }}>No tasks in this folder.</p>}

                                  <span className="flex-1 text-sm cursor-pointer" onClick={() => setExpandedTask(open ? null : t.id)} style={{ color: "#3a2420", textDecoration: t.done ? "line-through" : "none", opacity: t.done ? 0.5 : 1 }}>{t.title}</span>
                                  <span className="text-[11px] shrink-0" style={{ color: "#b89a93" }}>{shortDate(t.date)}{t.time ? " · " + fmtTime(t.time) : ""}</span>
                                  <button onClick={() => delTask(t.id)} style={{ color: "#c9b0a8" }} className="text-lg leading-none shrink-0">×</button>
                                </div>
                                {open && (

                                      <input type="date" value={t.date} onChange={(e) => updateTask(t.id, { date: e.target.value })} className="text-sm rounded-md px-2 py-1.5 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />
                                      <input type="time" value={t.time || ""} onChange={(e) => updateTask(t.id, { time: e.target.value })} className="text-sm rounded-md px-2 py-1.5 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />

                                      <span className="text-[11px]" style={{ color: "#b89a93" }}>Folder</span>

                                    </div>
                                    <div className="flex items-start gap-2">
                                      <span className="text-[11px] pt-1" style={{ color: "#b89a93" }}>Files</span>
                                      <div className="flex-1"><Attachments items={t.attachments} onAdd={async (file) => { const att = await window.fb.uploadFile(user.uid, t.id, file); updateTask(t.id, { attachments: [...(t.attachments || []), att] }); }} onRemove={async (att) => { try { await window.fb.deleteFile(att.path); } catch (e2) {} updateTask(t.id, { attachments: (t.attachments || []).filter((a) => a.path !== att.path) }); }} /></div>
                                    </div>
                                    <textarea value={t.details || ""} onChange={(e) => updateTask(t.id, { details: e.target.value })} rows={3} placeholder="Add notes or comments…" className="w-full resize-none text-sm rounded-md px-3 py-2 outline-none leading-relaxed" style={{ background: "#fffdf8", border: "1px solid #e5d8c5", color: "#3a2420", fontFamily: "'Newsreader', serif" }} />
                                  </div>
                                )}
                              </div>
                            );

                            const open = expandedEvent === e.id;

                            <div key={e.id} className="border-b py-1.5" style={{ borderColor: "#f0e7d8" }}>
                              <div className="flex items-center gap-2">
                                <span>{e.emoji && e.emoji !== "📌" ? e.emoji : ""}</span>
                                <div className="flex-1 cursor-pointer" onClick={() => setExpandedEvent(open ? null : e.id)}>
                                  <div className="text-sm" style={{ color: "#3a2420" }}>{e.title}{e.details ? " ✎" : ""}</div>
                                  <div className="text-[11px]" style={{ color: "#5a7bb0", fontWeight: 600 }}>{shortDate(e.startDate)}{eventTimeLabel(e) ? " · " + eventTimeLabel(e) : ""}</div>
                                </div>
                                <span onClick={() => setExpandedEvent(open ? null : e.id)} className="cursor-pointer text-xs shrink-0 select-none" style={{ color: "#c4b3aa" }}>{open ? "▾" : "▸"}</span>
                                <button onClick={() => delEvent(e._key, e.id)} style={{ color: "#c9b0a8" }} className="text-lg leading-none shrink-0">×</button>
                              </div>
                              {open && (
                                <div className="pl-6 pt-2 space-y-2">
                                  <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-[11px]" style={{ color: "#b89a93" }}>Start</span>
                                    <input type="date" value={e.startDate || ""} onChange={(ev2) => editEvent(e._key, e.id, { startDate: ev2.target.value })} className="text-sm rounded-md px-2 py-1.5 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />
                                    <input type="time" value={e.startTime || ""} onChange={(ev2) => updateEvent(e._key, e.id, { startTime: ev2.target.value })} className="text-sm rounded-md px-2 py-1.5 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />
                                    <span className="text-[11px]" style={{ color: "#b89a93" }}>End</span>
                                    <input type="date" value={e.endDate || e.startDate || ""} onChange={(ev2) => updateEvent(e._key, e.id, { endDate: ev2.target.value })} className="text-sm rounded-md px-2 py-1.5 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />
                                    <input type="time" value={e.endTime || ""} onChange={(ev2) => updateEvent(e._key, e.id, { endTime: ev2.target.value })} className="text-sm rounded-md px-2 py-1.5 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />
                                  </div>
                                  <div className="flex items-center gap-2">
                                    <span className="text-[11px]" style={{ color: "#b89a93" }}>Folder</span>
                                    <FolderSelect value={e.folder} folders={folders} onCreate={addFolder} onChange={(v) => updateEvent(e._key, e.id, { folder: v })} />
                                  </div>
                                  <div className="flex items-start gap-2">
                                    <span className="text-[11px] pt-1" style={{ color: "#b89a93" }}>Files</span>
                                    <div className="flex-1"><Attachments items={e.attachments} onAdd={async (file) => { const att = await window.fb.uploadFile(user.uid, e.id, file); updateEvent(e._key, e.id, { attachments: [...(e.attachments || []), att] }); }} onRemove={async (att) => { try { await window.fb.deleteFile(att.path); } catch (e2) {} updateEvent(e._key, e.id, { attachments: (e.attachments || []).filter((a) => a.path !== att.path) }); }} /></div>
                                  </div>
                                  <textarea value={e.details || ""} onChange={(ev2) => updateEvent(e._key, e.id, { details: ev2.target.value })} rows={3} placeholder="Add notes or details…" className="w-full resize-none text-sm rounded-md px-3 py-2 outline-none leading-relaxed" style={{ background: "#fffdf8", border: "1px solid #e5d8c5", color: "#3a2420", fontFamily: "'Newsreader', serif" }} />
                                  <button onClick={() => setExpandedEvent(null)} className="text-sm rounded-md px-4 py-1.5 font-semibold" style={{ background: "#7c2d24", color: "#fff" }}>Save</button>
                                </div>
                              )}
                            </div>
                            );
                          })}
                        </>
                      );
                    }
                    const countFor = (id) => (Array.isArray(tasks) ? tasks : []).filter((t) => t.folder === id).length + allEvents.filter((e) => e.folder === id).length;
                    return (
                      <>
                        <div className="flex items-center justify-between mb-4">
                          <h1 style={{ fontFamily: "'Fraunces', serif", color: "#3a2420", fontWeight: 700 }} className="text-2xl">Folders</h1>
                          <button onClick={() => { const name = window.prompt("New folder name:"); if (name && name.trim()) addFolder(name.trim()); }}
                            className="text-sm rounded-md px-3 py-1.5 font-semibold" style={{ background: "#7c2d24", color: "#fff" }}>+ New folder</button>
                        </div>
                        {folders.length === 0 && <p className="text-sm italic" style={{ color: "#a8978f" }}>No folders yet. Create one, then assign tasks or events to it when adding them.</p>}
                        <div className="space-y-2">
                          {folders.map((f) => (
                            <div key={f.id} className="flex items-center gap-3 rounded-lg p-3" style={{ background: "#fffdf8", border: "1px solid #eee2d2" }}>
                              <span className="inline-block w-3.5 h-3.5 rounded-full shrink-0" style={{ background: folderColor(f.id) }} />
                              <button onClick={() => setOpenFolder(f.id)} className="flex-1 text-left">
                                <div className="text-sm font-semibold" style={{ color: "#3a2420" }}>{f.name}</div>
                                <div className="text-[11px]" style={{ color: "#b89a93" }}>{countFor(f.id)} item{countFor(f.id) === 1 ? "" : "s"}</div>
                              </button>
                              <button onClick={() => { if (window.confirm(`Delete folder "${f.name}"? Items stay, but lose this folder.`)) delFolder(f.id); }} style={{ color: "#c9b0a8" }} className="text-lg leading-none">×</button>
                            </div>
                          ))}
                        </div>
                      </>
                    );
                  })()}

                  {/* ===== NOTES VIEW ===== */}
                  {view === "notes" && (
                    <>
                      <div className="flex items-center justify-between mb-2">
                        <h1 style={{ fontFamily: "'Fraunces', serif", color: "#3a2420", fontWeight: 700 }} className="text-2xl">Notes</h1>
                        <button onClick={addNote} className="text-sm rounded-md px-3 py-1.5 font-semibold" style={{ background: "#7c2d24", color: "#fff" }}>+ New note</button>
                      </div>

                      {/* formatting ribbon */}
                      <div className="flex flex-wrap items-center gap-1 mb-3 p-1.5 rounded-lg" style={{ background: "#f1e8da" }}>
                        <RibbonDropdown label="Heading" options={HEADING_OPTS} onPick={(v) => exec("formatBlock", v)} />
                        <RibbonDropdown label="List" options={LIST_OPTS} onPick={(v) => exec(v)} />
                        <span className="w-px h-5 mx-1" style={{ background: "#d8cbb8" }} />
                        <RibbonBtn title="Bold" onClick={() => exec("bold")}><b>B</b></RibbonBtn>
                        <RibbonBtn title="Italic" onClick={() => exec("italic")}><i style={{ fontFamily: "'Newsreader', serif" }}>I</i></RibbonBtn>
                        <RibbonBtn title="Strikethrough" onClick={() => exec("strikeThrough")}><s>S</s></RibbonBtn>
                      </div>

                      <p className="text-[11px] mb-4" style={{ color: "#b89a93" }}>Tip: click into a note to write, use the ribbon to format, or select text and tap <span style={{ color: "#a8801f", fontWeight: 600 }}>+ Make task</span>.</p>
                      {flash && (
                        <div className="mb-3 text-sm rounded-md px-3 py-2" style={{ background: "#f3ead3", color: "#7c2d24" }}>{flash}</div>
                      )}
                      {notes.length === 0 && <p className="text-sm italic" style={{ color: "#a8978f" }}>No notes yet. Tap “New note” to jot something down.</p>}
                      <div className="space-y-3">
                        {notes.map((n) => {
                          const selActive = noteSel.id === n.id && noteSel.text.trim();
                          return (
                            <div key={n.id} className="rounded-lg relative" style={{ background: "#fffdf8", border: "1px solid #eee2d2" }}>
                              <div className="absolute left-0 top-0 bottom-0 w-1 rounded-l-lg" style={{ background: "#e8a7a0" }} />
                              <button onClick={() => delNote(n.id)} className="absolute top-1 right-2 text-lg leading-none z-10" style={{ color: "#c9b0a8" }}>×</button>
                              <RichNote note={n} onChange={updateNote} onSelect={onEditorSelect} />
                              {selActive && (
                                <div className="flex items-center gap-2 px-4 pb-2.5 pt-1.5 border-t" style={{ borderColor: "#f0e7d8" }}>
                                  <span className="text-[11px] truncate flex-1" style={{ color: "#9c8a82" }}>“{noteSel.text.trim()}”</span>
                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => taskFromSelection(n.id)}
                                    className="text-[11px] rounded-md px-2.5 py-1 font-semibold whitespace-nowrap" style={{ background: "#c9a227", color: "#3a2420" }}>+ Make task</button>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              </div>

              {/* tab rail (desktop only) */}
              {!isMobile && (
              <div className="flex flex-col gap-1.5 pl-1 pt-6">
                {TABS.map((t) => {
                  const active = view === t.id;
                  return (
                    <button key={t.id} onClick={() => setView(t.id)}
                      className="w-9 rounded-r-lg py-3 transition"
                      style={{
                        background: t.color,
                        boxShadow: active ? "2px 0 6px rgba(0,0,0,0.15)" : "none",
                        marginLeft: active ? "-6px" : "0",
                        writingMode: "vertical-rl",
                      }}>
                      <span style={{ fontFamily: "'Fraunces', serif", fontSize: "12px", fontWeight: 600, color: "#5e201a", transform: "rotate(180deg)", display: "inline-block" }}>
                        {t.label}
                      </span>
                    </button>
                  );
                })}
              </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Splash({ message }) {
      return (
        <div className="min-h-screen w-full flex items-center justify-center p-4" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
          <div className="text-sm" style={{ color: "#7c2d24" }}>{message}</div>
        </div>
      );
    }

    function LoginScreen() {
      const [email, setEmail] = useState("");
      const [pw, setPw] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);
      const go = async (mode) => {
        if (!email.trim() || !pw) { setErr("Please enter an email and password."); return; }
        setErr(""); setBusy(true);
        try {
          if (mode === "in") await window.fb.signIn(email.trim(), pw);
          else await window.fb.signUp(email.trim(), pw);
        } catch (e) {
          setErr((e && e.message ? e.message.replace("Firebase: ", "") : "Something went wrong.").replace(/\(auth.*\)\.?/, ""));
        } finally { setBusy(false); }
      };
      return (
        <div className="min-h-screen w-full flex items-center justify-center p-4" style={{ fontFamily: "'Newsreader', Georgia, serif" }}>
          <div className="w-full max-w-sm rounded-[28px] p-8 shadow-2xl" style={{ background: "linear-gradient(145deg,#7c2d24,#5e201a)" }}>
            <div className="rounded-2xl p-6" style={{ background: "#fbf7f0" }}>
              <h1 style={{ fontFamily: "'Fraunces', serif", color: "#3a2420", fontWeight: 700 }} className="text-2xl mb-1 text-center">My Daily Organizer</h1>
              <p className="text-xs text-center mb-5" style={{ color: "#b89a93" }}>Sign in to access your planner anywhere.</p>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email"
                className="w-full text-sm rounded-md px-3 py-2 mb-2 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />
              <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="Password"
                onKeyDown={(e) => e.key === "Enter" && go("in")}
                className="w-full text-sm rounded-md px-3 py-2 mb-3 outline-none" style={{ background: "#fff", border: "1px solid #e5d8c5", color: "#3a2420" }} />
              {err && <p className="text-xs mb-3" style={{ color: "#b3261e" }}>{err}</p>}
              <button disabled={busy} onClick={() => go("in")} className="w-full text-sm rounded-md py-2 font-semibold mb-2" style={{ background: "#7c2d24", color: "#fff", opacity: busy ? 0.6 : 1 }}>Sign in</button>
              <button disabled={busy} onClick={() => go("up")} className="w-full text-sm rounded-md py-2 font-semibold" style={{ background: "#f1e8da", color: "#7c2d24", opacity: busy ? 0.6 : 1 }}>Create account</button>
            </div>
          </div>
        </div>
      );
    }

    function Attachments({ items, onAdd, onRemove }) {
      const [busy, setBusy] = useState(false);
      const list = items || [];
      const pick = async (e) => {
        const file = e.target.files[0]; e.target.value = "";
        if (!file) return;
        setBusy(true);
        try { await onAdd(file); }
        catch (err) { window.alert("Upload failed: " + ((err && (err.message || err.code)) || "error")); }
        finally { setBusy(false); }
      };
      return (
        <div className="space-y-1">
          {list.map((a) => (
            <div key={a.path} className="flex items-center gap-2 text-[12px]">
              <a href={a.url} target="_blank" rel="noopener noreferrer" className="truncate flex-1" style={{ color: "#7c2d24", textDecoration: "underline" }}>📎 {a.name}</a>
              <button onClick={() => onRemove(a)} style={{ color: "#c9b0a8" }} className="text-base leading-none">×</button>
            </div>
          ))}
          <label className="inline-block text-[11px] rounded-md px-2 py-1 cursor-pointer" style={{ background: "#f1e8da", color: "#7c2d24" }}>
            {busy ? "Uploading…" : "📎 Add file"}
            <input type="file" onChange={pick} className="hidden" disabled={busy} />
          </label>
        </div>
      );
    }

    function FolderSelect({ value, folders, onChange, onCreate }) {
      return (
        <select value={value || ""} onChange={(e) => {
            if (e.target.value === "__new__") {
              const name = window.prompt("New folder name:");
              if (name && name.trim()) onChange(onCreate(name.trim()));
            } else { onChange(e.target.value); }
          }}
          className="text-sm rounded-md px-2 py-1.5 outline-none" style={{ background: "#f1e8da", color: "#3a2420" }}>
          <option value="">No folder</option>
          {folders.map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
          <option value="__new__">+ New folder…</option>
        </select>
      );
    }

    function RibbonBtn({ title, onClick, children }) {
      return (
        <button title={title} onMouseDown={(e) => e.preventDefault()} onClick={onClick}
          className="w-8 h-8 rounded flex items-center justify-center text-sm hover:bg-[#e8dcc7]"
          style={{ color: "#5e201a" }}>{children}</button>
      );
    }

    function RibbonDropdown({ label, options, onPick }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="relative">
          <button onMouseDown={(e) => e.preventDefault()} onClick={() => setOpen((o) => !o)}
            className="h-8 px-2 rounded flex items-center gap-1 text-sm hover:bg-[#e8dcc7]" style={{ color: "#5e201a" }}>
            {label} <span className="text-[10px]">▾</span>
          </button>
          {open && (
            <div className="absolute z-20 mt-1 rounded-md shadow-lg py-1" style={{ background: "#fff", border: "1px solid #e5d8c5" }}
              onMouseLeave={() => setOpen(false)}>
              {options.map((o) => (
                <button key={o.label} onMouseDown={(e) => e.preventDefault()}
                  onClick={() => { onPick(o.value); setOpen(false); }}
                  className="block w-full text-left px-3 py-1.5 text-sm hover:bg-[#f4e7da] whitespace-nowrap"
                  style={{ color: "#3a2420" }}>{o.label}</button>
              ))}
            </div>
          )}
        </div>
      );
    }

    function RichNote({ note, onChange, onSelect }) {
      const ref = useRef(null);
      const initial = useRef(note.html || "");
      return (
        <div ref={ref} contentEditable suppressContentEditableWarning
          onInput={() => onChange(note.id, ref.current.innerHTML)}
          onMouseUp={() => onSelect(note.id)}
          onKeyUp={() => onSelect(note.id)}
          className="rich-note outline-none text-sm leading-relaxed pl-4 pr-7 py-2.5 min-h-[90px]"
          style={{ color: "#3a2420", fontFamily: "'Newsreader', serif" }}
          dangerouslySetInnerHTML={{ __html: initial.current }} />
      );
    }

    function Row({ left, text, done, onDel }) {
      return (
        <div className="flex items-center gap-2 py-1.5 border-b" style={{ borderColor: "#f0e7d8" }}>
          <div className="w-5 flex justify-center">{left}</div>
          <span className="flex-1 text-sm" style={{ color: "#3a2420", textDecoration: done ? "line-through" : "none", opacity: done ? 0.5 : 1 }}>{text}</span>
          <button onClick={onDel} style={{ color: "#c9b0a8" }} className="text-lg leading-none">×</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Organizer />);
  </script>
</body>
</html>
